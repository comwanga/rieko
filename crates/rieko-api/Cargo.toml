[package]
name = "rieko-api"
description = "Read-only HTTP API for Rieko (axum)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
rieko-storage.workspace = true
rieko-status.workspace = true
rieko-findings.workspace = true
rieko-domain.workspace = true
rieko-ingest-btcpay.workspace = true
rieko-simulation-app = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
axum = "0.7"
tower-http = { version = "0.6", features = ["fs"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
chrono = { version = "0.4", features = ["serde"] }
subtle = "2"

# `simulate` enables the simulation API surface. Default on in v2.
[features]
default = ["simulate"]
simulate = ["dep:rieko-simulation-app"]
execute = []

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
chrono = { version = "0.4", features = ["serde"] }
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
tempfile = "3"

