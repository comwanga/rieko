[package]
name = "rieko-detectors"
description = "Detectors: domain graph → typed findings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
rieko-domain.workspace = true
rieko-graph.workspace = true
rieko-findings.workspace = true
rieko-status.workspace = true
thiserror.workspace = true
chrono = { version = "0.4", features = ["serde"] }
serde_json.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rieko-recommendations.workspace = true
rieko-storage.workspace = true
rieko-ingest-btcpay.workspace = true
rieko-ingest-lnd.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
