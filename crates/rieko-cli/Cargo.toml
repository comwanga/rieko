[package]
name = "rieko-cli"
description = "Rieko command-line entrypoint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "rieko"
path = "src/main.rs"

[dependencies]
rieko-domain.workspace = true
rieko-graph.workspace = true
rieko-storage.workspace = true
rieko-findings.workspace = true
rieko-detectors.workspace = true
rieko-recommendations.workspace = true
rieko-simulation = { workspace = true, optional = true }
rieko-simulation-app = { workspace = true, optional = true }
rieko-execution = { workspace = true, optional = true }
rieko-alerts.workspace = true
rieko-llm.workspace = true
rieko-status.workspace = true
rieko-ingest-lnd.workspace = true
rieko-api.workspace = true

anyhow.workspace = true
axum = "0.7"
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

# `simulate` enables what-if projection of recommendations. Enabled by default
# in v2 — the simulation crate is pure and read-only (no node mutation).
# `execute` gates node-mutating actions behind explicit human approval.
# `future` is the combined legacy gate, preserved for compatibility.
[features]
default = ["simulate"]
simulate = ["rieko-simulation", "rieko-simulation-app", "rieko-api/simulate"]
execute = ["rieko-execution", "rieko-api/execute"]
future = ["simulate", "execute"]

[dev-dependencies]
tempfile = "3"
