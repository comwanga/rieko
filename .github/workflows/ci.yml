name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Rust audit
        run: cargo audit --deny warnings
      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

  test:
    name: Workspace tests
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and check frontend
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run build
      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Test embedded UI
        run: cargo test -p rieko-api --test embedded_ui
      - name: Build & test
        run: cargo test --workspace --all-features
      # The browser suite runs the agent and seeds data with the `rieko` CLI.
      # Build both binaries here rather than relying on an earlier step.
      - name: Build browser-test binaries
        run: cargo build -p rieko-cli
      - name: Install Chromium
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser smoke
        working-directory: frontend
        run: npm run test:browser
      - name: Browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
      - name: Clippy
        run: cargo clippy --workspace --all-features -- -D warnings
      - name: Format check
        run: cargo fmt --check

  release:
    name: Build & publish release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build embedded binary
        run: cargo build --release --features rieko_ui_embedded
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/rieko
          generate_release_notes: true
