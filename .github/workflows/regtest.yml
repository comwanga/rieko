name: Bitcoin Core + LND Regtest Integration

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    # Run nightly at 02:00 UTC
    - cron: "0 2 * * *"

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  BITCOIND_IMAGE: ruimarinho/bitcoin-core:28
  LND_IMAGE: lightninglabs/lnd:v0.18.5-beta
  BTCPAY_IMAGE: btcpayserver/btcpayserver:1.13.7
  NBXPLORER_IMAGE: nicolasdorier/nbxplorer:2.5.12
  POSTGRES_IMAGE: btcpayserver/postgres:13.13
  RPC_USER: rieko
  RPC_PASS: riekopass

jobs:
  regtest-integration:
    name: Bitcoin Core + LND Regtest Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-regtest-${{ hashFiles('**/Cargo.lock') }}

      - name: Build workspace
        run: cargo build --workspace

      # ---------------------------------------------------------
      # 1. Deterministic Fixture Smoke Tests
      # ---------------------------------------------------------
      - name: Run fixture determinism tests
        run: |
          echo "Running fixture-backed demo seed test..."
          cargo test --test seed_demo --package rieko-cli -- --nocapture

          echo "Running fixture-backed scan..."
          cargo run -- scan \
            --network regtest \
            --fixture fixtures/channels.json \
            --db "${RUNNER_TEMP}/rieko_fixture.db" \
            --verbose

      # ---------------------------------------------------------
      # 2. Bitcoin Core Regtest Setup & Initialization
      # ---------------------------------------------------------
      - name: Start Bitcoin Core regtest node
        run: |
          docker network create regtest-net

          docker run -d \
            --name bitcoind \
            --network regtest-net \
            -p 127.0.0.1:18443:18443 \
            -p 127.0.0.1:28332:28332 \
            -p 127.0.0.1:28333:28333 \
            ${{ env.BITCOIND_IMAGE }} \
            -regtest=1 \
            -server=1 \
            -rpcuser=${{ env.RPC_USER }} \
            -rpcpassword=${{ env.RPC_PASS }} \
            -rpcbind=0.0.0.0 \
            -rpcallowip=0.0.0.0/0 \
            -rpcport=18443 \
            -port=18444 \
            -bind=0.0.0.0:18444 \
            -whitelist=0.0.0.0/0 \
            -zmqpubrawblock=tcp://0.0.0.0:28332 \
            -zmqpubrawtx=tcp://0.0.0.0:28333 \
            -txindex=1 \
            -fallbackfee=0.0002

      - name: Wait for Bitcoin Core readiness
        run: |
          echo "Waiting for Bitcoin Core RPC to become ready..."
          READY=0
          for i in $(seq 1 30); do
            if docker exec bitcoind bitcoin-cli -regtest -rpcuser=${{ env.RPC_USER }} -rpcpassword=${{ env.RPC_PASS }} getblockchaininfo > /dev/null 2>&1; then
              echo "Bitcoin Core RPC is ready after ${i}s."
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: Bitcoin Core failed to start within 30 seconds."
            docker logs bitcoind --tail 50
            exit 1
          fi

      - name: Initialize Bitcoin Core wallet & mine 101 blocks
        run: |
          echo "Creating default Bitcoin Core wallet..."
          docker exec bitcoind bitcoin-cli -regtest -rpcuser=${{ env.RPC_USER }} -rpcpassword=${{ env.RPC_PASS }} createwallet default

          echo "Mining 101 regtest blocks to mature coinbase..."
          docker exec bitcoind bitcoin-cli -regtest -rpcuser=${{ env.RPC_USER }} -rpcpassword=${{ env.RPC_PASS }} -generate 101

          BLOCK_COUNT=$(docker exec bitcoind bitcoin-cli -regtest -rpcuser=${{ env.RPC_USER }} -rpcpassword=${{ env.RPC_PASS }} getblockcount)
          echo "Current block count: $BLOCK_COUNT"

      # ---------------------------------------------------------
      # 3. LND Regtest Setup & Initialization
      # ---------------------------------------------------------
      - name: Start LND regtest node
        run: |
          mkdir -p "${RUNNER_TEMP}/lnd"

          # Pre-generate RFC 5280 compliant end-entity TLS cert/key (CA:FALSE) with SANs
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
            -nodes \
            -keyout "${RUNNER_TEMP}/lnd/tls.key" \
            -out "${RUNNER_TEMP}/lnd/tls.cert" \
            -days 365 \
            -subj "/CN=localhost" \
            -addext "subjectAltName = DNS:localhost,IP:127.0.0.1" \
            -addext "basicConstraints = critical,CA:FALSE"

          docker run -d \
            --name lnd \
            --network regtest-net \
            -p 127.0.0.1:8080:8080 \
            -p 127.0.0.1:10009:10009 \
            -v "${RUNNER_TEMP}/lnd:/root/.lnd" \
            ${{ env.LND_IMAGE }} \
            --bitcoin.regtest \
            --bitcoin.node=bitcoind \
            --bitcoind.rpchost=bitcoind:18443 \
            --bitcoind.rpcuser=${{ env.RPC_USER }} \
            --bitcoind.rpcpass=${{ env.RPC_PASS }} \
            --bitcoind.zmqpubrawblock=tcp://bitcoind:28332 \
            --bitcoind.zmqpubrawtx=tcp://bitcoind:28333 \
            --rpclisten=0.0.0.0:10009 \
            --restlisten=0.0.0.0:8080 \
            --listen=0.0.0.0:9735 \
            --noseedbackup

      - name: Initialize LND wallet and wait for readiness
        run: |
          echo "Waiting for LND RPC listener..."
          for i in $(seq 1 30); do
            if docker exec lnd lncli --network=regtest state 2>&1 | grep -qE "NON_EXISTING|LOCKED|UNLOCKED|WAITING_TO_START"; then
              echo "LND RPC is accepting commands."
              break
            fi
            sleep 1
          done

          echo "Initializing LND wallet non-interactively..."
          printf "let-me-in-12345\nlet-me-in-12345\n" | docker exec -i lnd lncli --network=regtest create --noseedbackup || true

          echo "Waiting for LND TLS cert, macaroon, and REST readiness..."
          LND_TLS="${RUNNER_TEMP}/lnd/tls.cert"
          LND_MAC="${RUNNER_TEMP}/lnd/data/chain/bitcoin/regtest/readonly.macaroon"
          READY=0

          for i in $(seq 1 45); do
            # Fix volume permissions so runner user can access generated credentials
            sudo chown -R "$(id -u):$(id -g)" "${RUNNER_TEMP}/lnd" 2>/dev/null || true

            if [ -f "$LND_TLS" ] && [ -f "$LND_MAC" ]; then
              MAC_HEX=$(xxd -p -c 1000 "$LND_MAC" | tr -d '\n')
              HTTP_CODE=$(curl -s --cacert "$LND_TLS" -o /dev/null -w "%{http_code}" -H "Grpc-Metadata-macaroon: $MAC_HEX" https://localhost:8080/v1/getinfo 2>/dev/null || true)
              if [ "$HTTP_CODE" = "200" ]; then
                echo "LND REST is fully ready (HTTP 200) after ${i}s."
                READY=1
                break
              fi
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: LND failed to initialize within 45 seconds."
            docker logs lnd --tail 50
            exit 1
          fi

      # ---------------------------------------------------------
      # 4. BTCPay Server Regtest Setup & Provisioning
      # ---------------------------------------------------------
      - name: Start pinned BTCPay Server regtest services
        run: |
          mkdir -p "${RUNNER_TEMP}/nbxplorer"

          docker run -d \
            --name postgres \
            --network regtest-net \
            --shm-size=256m \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            "${POSTGRES_IMAGE}" \
            -c random_page_cost=1.0 \
            -c shared_preload_libraries=pg_stat_statements

          POSTGRES_READY=0
          for i in $(seq 1 30); do
            if docker exec postgres pg_isready -U postgres > /dev/null 2>&1; then
              echo "PostgreSQL is ready after ${i}s."
              POSTGRES_READY=1
              break
            fi
            sleep 1
          done
          if [ "$POSTGRES_READY" -ne 1 ]; then
            echo "ERROR: PostgreSQL failed to start within 30 seconds."
            docker logs postgres --tail 100
            exit 1
          fi

          docker run -d \
            --name nbxplorer \
            --network regtest-net \
            -v "${RUNNER_TEMP}/nbxplorer:/datadir" \
            -e NBXPLORER_NETWORK=regtest \
            -e NBXPLORER_BIND=0.0.0.0:32838 \
            -e NBXPLORER_CHAINS=btc \
            -e NBXPLORER_SIGNALFILESDIR=/datadir \
            -e NBXPLORER_BTCRPCURL=http://bitcoind:18443/ \
            -e NBXPLORER_BTCRPCUSER="${RPC_USER}" \
            -e NBXPLORER_BTCRPCPASSWORD="${RPC_PASS}" \
            -e NBXPLORER_BTCNODEENDPOINT=bitcoind:18444 \
            -e 'NBXPLORER_POSTGRES=User ID=postgres;Host=postgres;Port=5432;Application Name=nbxplorer;MaxPoolSize=20;Database=nbxplorerregtest' \
            "${NBXPLORER_IMAGE}"

          NBXPLORER_READY=0
          for i in $(seq 1 60); do
            if [ -s "${RUNNER_TEMP}/nbxplorer/RegTest/.cookie" ]; then
              echo "NBXplorer authentication cookie is ready after ${i}s."
              NBXPLORER_READY=1
              break
            fi
            sleep 1
          done
          if [ "$NBXPLORER_READY" -ne 1 ]; then
            echo "ERROR: NBXplorer failed to create its auth cookie within 60 seconds."
            docker logs nbxplorer --tail 100
            exit 1
          fi

          docker run -d \
            --name btcpayserver \
            --network regtest-net \
            -p 127.0.0.1:23000:49392 \
            -v "${RUNNER_TEMP}/lnd:/etc/lnd:ro" \
            -v "${RUNNER_TEMP}/nbxplorer:/root/.nbxplorer:ro" \
            -e 'BTCPAY_POSTGRES=User ID=postgres;Host=postgres;Port=5432;Application Name=btcpayserver;Database=btcpayserverregtest' \
            -e 'BTCPAY_EXPLORERPOSTGRES=User ID=postgres;Host=postgres;Port=5432;Application Name=btcpayserver;MaxPoolSize=80;Database=nbxplorerregtest' \
            -e BTCPAY_NETWORK=regtest \
            -e BTCPAY_BIND=0.0.0.0:49392 \
            -e BTCPAY_CHAINS=btc \
            -e BTCPAY_BTCEXPLORERURL=http://nbxplorer:32838/ \
            -e 'BTCPAY_BTCLIGHTNING=type=lnd-rest;server=https://lnd:8080/;macaroonfilepath=/etc/lnd/data/chain/bitcoin/regtest/admin.macaroon;allowinsecure=true' \
            "${BTCPAY_IMAGE}"

          BTCPAY_READY=0
          for i in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:23000/api/v1/health > /dev/null; then
              echo "BTCPay Server is ready after ${i}s."
              BTCPAY_READY=1
              break
            fi
            sleep 1
          done
          if [ "$BTCPAY_READY" -ne 1 ]; then
            echo "ERROR: BTCPay Server failed to start within 120 seconds."
            docker logs nbxplorer --tail 100
            docker logs btcpayserver --tail 100
            exit 1
          fi

      - name: Provision BTCPay store and scoped read-only Greenfield key
        env:
          BTCPAY_URL: http://127.0.0.1:23000
          BTCPAY_CI_USER: rieko-regtest@example.invalid
          BTCPAY_CI_PASSWORD: Rieko-Regtest-Only-2026!
        run: |
          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            -X POST \
            -d "$(jq -n --arg email "$BTCPAY_CI_USER" --arg password "$BTCPAY_CI_PASSWORD" '{email:$email,password:$password,isAdministrator:true}')" \
            "${BTCPAY_URL}/api/v1/users" > /dev/null

          echo "Creating temporary BTCPay bootstrap API key..."
          BOOTSTRAP_KEY_FILE="${RUNNER_TEMP}/btcpay-bootstrap-key.json"
          BOOTSTRAP_KEY_STATUS=$(curl --silent --show-error \
            --output "$BOOTSTRAP_KEY_FILE" \
            --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            --user "${BTCPAY_CI_USER}:${BTCPAY_CI_PASSWORD}" \
            -X POST \
            -d '{"label":"rieko-regtest-bootstrap","permissions":["unrestricted"]}' \
            "${BTCPAY_URL}/api/v1/api-keys")
          if [ "$BOOTSTRAP_KEY_STATUS" != "200" ]; then
            echo "ERROR: bootstrap API key creation returned HTTP ${BOOTSTRAP_KEY_STATUS}."
            cat "$BOOTSTRAP_KEY_FILE"
            exit 1
          fi
          BOOTSTRAP_KEY_JSON=$(< "$BOOTSTRAP_KEY_FILE")
          BOOTSTRAP_API_KEY=$(jq -er '.apiKey' <<< "$BOOTSTRAP_KEY_JSON")
          echo "::add-mask::${BOOTSTRAP_API_KEY}"

          echo "Creating BTCPay regtest store..."
          STORE_FILE="${RUNNER_TEMP}/btcpay-store.json"
          STORE_STATUS=$(curl --silent --show-error \
            --output "$STORE_FILE" \
            --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H "Authorization: token ${BOOTSTRAP_API_KEY}" \
            -X POST \
            -d '{"name":"Rieko regtest health smoke"}' \
            "${BTCPAY_URL}/api/v1/stores")
          if [ "$STORE_STATUS" != "200" ]; then
            echo "ERROR: store creation returned HTTP ${STORE_STATUS}."
            cat "$STORE_FILE"
            exit 1
          fi
          STORE_JSON=$(< "$STORE_FILE")
          STORE_ID=$(jq -er '.id' <<< "$STORE_JSON")

          LIGHTNING_FILE="${RUNNER_TEMP}/btcpay-lightning.json"
          LIGHTNING_STATUS=$(curl --silent --show-error \
            --output "$LIGHTNING_FILE" \
            --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H "Authorization: token ${BOOTSTRAP_API_KEY}" \
            -X PUT \
            -d '{"enabled":true,"connectionString":"Internal Node"}' \
            "${BTCPAY_URL}/api/v1/stores/${STORE_ID}/payment-methods/LightningNetwork/BTC")
          if [ "$LIGHTNING_STATUS" != "200" ]; then
            echo "ERROR: Lightning payment method configuration returned HTTP ${LIGHTNING_STATUS}."
            cat "$LIGHTNING_FILE"
            exit 1
          fi

          KEY_BODY=$(jq -n \
            --arg label 'rieko-regtest-read-only' \
            --arg lightning "btcpay.store.canuselightningnode:${STORE_ID}" \
            --arg wallet "btcpay.store.canviewwallet:${STORE_ID}" \
            --arg invoices "btcpay.store.canviewinvoices:${STORE_ID}" \
            --arg settings "btcpay.store.canviewstoresettings:${STORE_ID}" \
            '{label:$label,permissions:[$lightning,$wallet,$invoices,$settings]}')
          KEY_JSON=$(curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            -H "Authorization: token ${BOOTSTRAP_API_KEY}" \
            -X POST \
            -d "$KEY_BODY" \
            "${BTCPAY_URL}/api/v1/api-keys")
          API_KEY=$(jq -er '.apiKey' <<< "$KEY_JSON")

          echo "::add-mask::${API_KEY}"
          echo "BTCPAY_GREENFIELD_URL=${BTCPAY_URL}" >> "$GITHUB_ENV"
          echo "BTCPAY_GREENFIELD_STORE=${STORE_ID}" >> "$GITHUB_ENV"
          echo "BTCPAY_GREENFIELD_API_KEY=${API_KEY}" >> "$GITHUB_ENV"

          curl --fail-with-body --silent --show-error \
            -H "Authorization: token ${API_KEY}" \
            "${BTCPAY_URL}/api/v1/stores/${STORE_ID}/lightning/BTC/info" \
            | jq -e '.blockHeight >= 0' > /dev/null

          curl --fail-with-body --silent --show-error \
            -H "Authorization: token ${API_KEY}" \
            "${BTCPAY_URL}/api/v1/stores/${STORE_ID}/lightning/BTC/channels" \
            | jq -e 'type == "array"' > /dev/null

          curl --fail-with-body --silent --show-error \
            -H "Authorization: token ${BOOTSTRAP_API_KEY}" \
            -X DELETE \
            "${BTCPAY_URL}/api/v1/api-keys/current" > /dev/null

      # ---------------------------------------------------------
      # 5. Live Integration Tests
      # ---------------------------------------------------------
      - name: Run live LND adapter integration test
        env:
          LND_REST: "https://localhost:8080"
          LND_TLS_CERT: "${{ runner.temp }}/lnd/tls.cert"
          LND_MACAROON: "${{ runner.temp }}/lnd/data/chain/bitcoin/regtest/readonly.macaroon"
        run: |
          echo "Exercising rieko-ingest-lnd against live regtest node with real TLS & macaroon..."
          cargo test --package rieko-ingest-lnd --test live_regtest -- --nocapture

      - name: Run live Rieko scan pipeline
        run: |
          echo "Running live scan against LND regtest node..."
          cargo run -- scan \
            --network regtest \
            --lnd-rest https://localhost:8080 \
            --tls-cert "${RUNNER_TEMP}/lnd/tls.cert" \
            --macaroon "${RUNNER_TEMP}/lnd/data/chain/bitcoin/regtest/readonly.macaroon" \
            --db "${RUNNER_TEMP}/rieko_live.db" \
            --verbose

      - name: Run real BTCPay Greenfield health smoke test
        env:
          BTCPAY_REGTEST_SMOKE_ENABLED: "true"
        run: cargo test -p rieko-cli --test live_btcpay_health -- --ignored --nocapture

      # ---------------------------------------------------------
      # 6. Diagnostics & Teardown
      # ---------------------------------------------------------
      - name: Collect diagnostics on failure
        if: failure()
        run: |
          echo "=== Bitcoin Core Status ==="
          docker exec bitcoind bitcoin-cli -regtest -rpcuser=${{ env.RPC_USER }} -rpcpassword=${{ env.RPC_PASS }} getblockchaininfo 2>/dev/null || true
          echo "=== Bitcoin Core Logs (tail 50) ==="
          docker logs bitcoind --tail 50 2>/dev/null || true
          echo "=== LND Logs (tail 50) ==="
          docker logs lnd --tail 50 2>/dev/null || true
          echo "=== NBXplorer Logs (tail 100) ==="
          docker logs nbxplorer --tail 100 2>/dev/null || true
          echo "=== BTCPay Server Logs (tail 100) ==="
          docker logs btcpayserver --tail 100 2>/dev/null || true
          echo "=== PostgreSQL Logs (tail 100) ==="
          docker logs postgres --tail 100 2>/dev/null || true

      - name: Teardown infrastructure
        if: always()
        run: |
          docker stop btcpayserver nbxplorer postgres lnd bitcoind 2>/dev/null || true
          docker rm btcpayserver nbxplorer postgres lnd bitcoind 2>/dev/null || true
          docker network rm regtest-net 2>/dev/null || true
          rm -rf "${RUNNER_TEMP}/lnd" "${RUNNER_TEMP}/nbxplorer" "${RUNNER_TEMP}/rieko_live.db" "${RUNNER_TEMP}/rieko_fixture.db" 2>/dev/null || true
