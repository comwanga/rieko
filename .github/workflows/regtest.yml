name: Regtest Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run nightly at 02:00 UTC
    - cron: "0 2 * * *"

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  regtest:
    name: LND regtest smoke test
    runs-on: ubuntu-latest
    services:
      bitcoind:
        image: kylemanna/bitcoind:latest
        options: --entrypoint bitcoind
        env:
          BITCOIN_DATA: /home/bitcoin/.bitcoin
        ports:
          - 18443:18443
    steps:
      - uses: actions/checkout@v4
      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-regtest-${{ hashFiles('**/Cargo.lock') }}
      - name: Build rieko
        run: cargo build --workspace
      - name: Run fixture-based scan smoke test
        run: |
          cargo test --test seed_demo --package rieko-cli -- --nocapture
      - name: Scan with fixture
        run: |
          cargo run -- scan \
            --network regtest \
            --fixture fixtures/snapshot_regtest.json \
            --db /tmp/rieko_regtest.db
